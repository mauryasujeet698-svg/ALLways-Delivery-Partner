name: Publish ALLways Delivery Partner Android Release

on:
  workflow_run:
    workflows: ["ALLways Delivery Partner Android"]
    types: [completed]

permissions:
  actions: read
  contents: write

jobs:
  publish:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: self-hosted
    steps:
      - name: Checkout build commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Download APK artifact
        uses: actions/download-artifact@v5
        with:
          name: allways-delivery-partner-apk
          path: release
          run-id: ${{ github.event.workflow_run.id || github.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Read app version
        id: version
        shell: pwsh
        run: |
          $versionLine = Get-Content pubspec.yaml | Where-Object { $_ -match '^version:' } | Select-Object -First 1
          $version = ($versionLine -split ':',2)[1].Trim().Split('+')[0]
          if ([string]::IsNullOrWhiteSpace($version)) { throw "Could not read app version." }
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Prepare stable release assets
        shell: pwsh
        run: |
          $apk = Get-ChildItem -Path release -Recurse -Filter *.apk | Select-Object -First 1
          if (-not $apk) { throw "APK artifact not found." }
          Copy-Item $apk.FullName "release/allways-delivery-partner-v${{ steps.version.outputs.version }}.apk"
          Copy-Item $apk.FullName "release/allways-delivery-partner-latest.apk"

      - name: Publish latest release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: allways-latest
          name: "ALLways allways-delivery-partner v${{ steps.version.outputs.version }}"
          draft: false
          prerelease: false
          files: |
            release/allways-delivery-partner-v${{ steps.version.outputs.version }}.apk
            release/allways-delivery-partner-latest.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
