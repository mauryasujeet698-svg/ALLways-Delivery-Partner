name: ALLways Delivery Partner QA Build

on:
  push:
    branches: [audit-implementation-2026-10, fix/fcm-token-refresh-resilience]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: allways-delivery-partner-qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qa-build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout approved feature branch
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android project scaffolding for QA build
        run: flutter create --platforms=android --org com.allways --project-name delivery .

      - name: Bound Gradle memory for hosted runner
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path("android/gradle.properties")
          text = p.read_text() if p.exists() else ""
          line = "org.gradle.jvmargs=-Xmx3G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError"
          if re.search(r"^org\\.gradle\\.jvmargs=.*$", text, re.M):
              text = re.sub(r"^org\\.gradle\\.jvmargs=.*$", line, text, count=1, flags=re.M)
          else:
              text += "\\n" + line + "\\n"
          for key, value in (("org.gradle.workers.max", "2"), ("org.gradle.parallel", "false")):
              pattern = rf"^{re.escape(key)}=.*$"
              setting = f"{key}={value}"
              if re.search(pattern, text, re.M):
                  text = re.sub(pattern, setting, text, count=1, flags=re.M)
              else:
                  text += setting + "\\n"
          p.write_text(text)
          PY

      - name: Install dependencies
        run: flutter pub get

      - name: Static analysis
        run: flutter analyze

      - name: Unit and widget tests
        run: flutter test

      - name: Build QA debug APK
        run: flutter build apk --debug --target-platform android-arm64

      - name: Validate APK and report size
        run: |
          apk="build/app/outputs/flutter-apk/app-debug.apk"
          test -s "$apk"
          size=$(stat -c%s "$apk")
          echo "QA APK size: $((size / 1024 / 1024)) MiB ($size bytes)"
          sha256sum "$apk"

      - name: Upload QA APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: allways-delivery-partner-qa-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 7
