name: ALLways Delivery Partner Android
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: allways-delivery-partner-android
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Bootstrap Android
        shell: bash
        run: |
          flutter create --platforms=android --org com.allways --project-name delivery .
          python3 - <<'PY'
          from pathlib import Path
          p = Path("android/settings.gradle.kts")
          s = p.read_text()
          if 'id("com.google.gms.google-services") version "4.5.0" apply false' not in s:
              s = s.replace(
                  "plugins {",
                  'plugins {\n    id("com.google.gms.google-services") version "4.5.0" apply false',
                  1,
              )
          p.write_text(s)

          p = Path("android/app/build.gradle.kts")
          s = p.read_text()
          if 'id("com.google.gms.google-services")' not in s:
              s = s.replace(
                  "plugins {",
                  'plugins {\n    id("com.google.gms.google-services")',
                  1,
              )
          prefix = """import java.util.Properties

          val keystorePropertiesFile = rootProject.file("key.properties")
          val keystoreProperties = Properties()
          if (keystorePropertiesFile.exists()) {
              keystorePropertiesFile.inputStream().use { keystoreProperties.load(it) }
          }

          """
          if "val keystorePropertiesFile = rootProject.file" not in s:
              s = prefix + s
          signing = """    signingConfigs {
              if (keystorePropertiesFile.exists()) {
                  create("release") {
                      keyAlias = keystoreProperties["keyAlias"] as String
                      keyPassword = keystoreProperties["keyPassword"] as String
                      storeFile = rootProject.file(keystoreProperties["storeFile"] as String)
                      storePassword = keystoreProperties["storePassword"] as String
                  }
              }
          }

          """
          if "signingConfigs {" not in s:
              s = s.replace("android {", "android {" + chr(10) + signing, 1)
          s = s.replace('signingConfig = signingConfigs.getByName("debug")',
              'signingConfig = signingConfigs.getByName("release")')
          s = s.replace('namespace = "com.example.delivery"', 'namespace = "com.allways.delivery"')
          s = s.replace('applicationId = "com.example.delivery"', 'applicationId = "com.allways.delivery"')
          if 'namespace = "com.allways.delivery"' not in s:
              s = s.replace("android {", 'android {\n    namespace = "com.allways.delivery"', 1)
          s = s.replace('namespace = "com.example.delivery"', 'namespace = "com.allways.delivery"')
          s = s.replace('applicationId = "com.example.delivery"', 'applicationId = "com.allways.delivery"')
          if 'applicationId = "com.allways.delivery"' not in s:
              s = s.replace('applicationId = ""', 'applicationId = "com.allways.delivery"', 1)
          p.write_text(s)

          manifest = Path("android/app/src/main/AndroidManifest.xml")
          manifest.parent.mkdir(parents=True, exist_ok=True)
          manifest.write_text("""<manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <uses-permission android:name="android.permission.INTERNET"/>
            <uses-permission android:name="android.permission.VIBRATE"/>
            <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>
            <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION"/>
            <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION"/>
            <uses-permission android:name="android.permission.ACCESS_BACKGROUND_LOCATION"/>
            <uses-permission android:name="android.permission.FOREGROUND_SERVICE"/>
            <uses-permission android:name="android.permission.FOREGROUND_SERVICE_LOCATION"/>
            <application android:label="ALLways Delivery Partner" android:icon="@mipmap/ic_launcher">
              <activity android:name=".MainActivity" android:exported="true" android:launchMode="singleTop" android:theme="@style/LaunchTheme" android:configChanges="orientation|keyboardHidden|keyboard|screenSize|smallestScreenSize|locale|layoutDirection|fontScale|screenLayout|density|uiMode" android:hardwareAccelerated="true" android:windowSoftInputMode="adjustResize">
                <meta-data android:name="io.flutter.embedding.android.NormalTheme" android:resource="@style/NormalTheme"/>
                <intent-filter><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/></intent-filter>
              </activity>
              <meta-data android:name="com.google.firebase.messaging.default_notification_channel_id" android:value="allways_urgent_v4"/>
              <meta-data android:name="flutterEmbedding" android:value="2"/>
            </application>
          </manifest>
          """)
          icon = Path("android/app/src/main/res/drawable/allways_delivery_partner_icon.xml")
          icon.parent.mkdir(parents=True, exist_ok=True)
          icon.write_text("""<vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="108dp" android:height="108dp" android:viewportWidth="108" android:viewportHeight="108"><path android:fillColor="#F07C22" android:pathData="M54,4A50,50 0,1 0,54 104A50,50 0,1 0,54 4"/><path android:fillColor="#FFFFFF" android:pathData="M25,32H61V69H25Z"/><path android:fillColor="#DDEBFF" android:pathData="M61,43H75L85,53V69H61Z"/><path android:fillColor="#F07C22" android:pathData="M61,43H75L85,53H61Z"/><path android:fillColor="#17324D" android:pathData="M35,67A8,8 0,1 0,51 67A8,8 0,1 0,35 67M67,67A8,8 0,1 0,83 67A8,8 0,1 0,67 67"/><path android:fillColor="#FFFFFF" android:pathData="M39,67A4,4 0,1 0,47 67A4,4 0,1 0,39 67M71,67A4,4 0,1 0,79 67A4,4 0,1 0,71 67"/><path android:fillColor="#17324D" android:pathData="M30,40H56V46H30Z"/></vector>
          """)
          manifest.write_text(manifest.read_text().replace('android:icon="@mipmap/ic_launcher"','android:icon="@drawable/allways_delivery_partner_icon"'))
          PY

          cat > android/app/src/main/kotlin/com/allways/delivery/MainActivity.kt <<'KOTLIN'
          package com.allways.delivery
          import android.app.NotificationChannel
          import android.app.NotificationManager
          import android.app.PendingIntent
          import android.content.Context
          import android.content.Intent
          import android.media.AudioAttributes
          import android.media.RingtoneManager
          import android.os.Build
          import android.os.Bundle
          import android.speech.tts.TextToSpeech
          import androidx.core.app.NotificationCompat
          import io.flutter.embedding.android.FlutterActivity
          import io.flutter.embedding.engine.FlutterEngine
          import io.flutter.plugin.common.MethodChannel
          import java.util.Locale

          class MainActivity : FlutterActivity() {
              private val channelId = "allways_urgent_v4"
              private var textToSpeech: TextToSpeech? = null

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  createChannel()
              }

              override fun configureFlutterEngine(flutterEngine: FlutterEngine) {
                  super.configureFlutterEngine(flutterEngine)
                  MethodChannel(flutterEngine.dartExecutor.binaryMessenger, "allways_notifications")
                      .setMethodCallHandler { call, result ->
                          when (call.method) {
                              "showNotification" -> {
                                  showNotification(call.argument<String>("title") ?: "ALLways", call.argument<String>("body") ?: "")
                                  result.success(null)
                              }
                              "speakAssignment" -> {
                                  speakAssignment(call.argument<String>("text") ?: "New delivery assigned.")
                                  result.success(null)
                              }
                              else -> result.notImplemented()
                          }
                      }
              }

              private fun createChannel() {
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      val sound = RingtoneManager.getDefaultUri(RingtoneManager.TYPE_ALARM)
                      val audio = AudioAttributes.Builder().setUsage(AudioAttributes.USAGE_ALARM).build()
                      val channel = NotificationChannel(channelId, "ALLways Urgent Alerts", NotificationManager.IMPORTANCE_HIGH).apply {
                          description = "Ride and delivery requests that need immediate attention"
                          setSound(sound, audio)
                          enableVibration(true)
                          vibrationPattern = longArrayOf(0, 450, 180, 450, 180, 700)
                      }
                      getSystemService(NotificationManager::class.java).createNotificationChannel(channel)
                  }
              }

              private fun showNotification(title: String, body: String) {
                  createChannel()
                  val launch = packageManager.getLaunchIntentForPackage(packageName)?.apply {
                      flags = Intent.FLAG_ACTIVITY_NEW_TASK or Intent.FLAG_ACTIVITY_CLEAR_TOP
                  }
                  val pending = launch?.let {
                      PendingIntent.getActivity(
                          this, (System.currentTimeMillis() and 0x7fffffff).toInt(), it,
                          PendingIntent.FLAG_UPDATE_CURRENT or if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.M) PendingIntent.FLAG_IMMUTABLE else 0
                      )
                  }
                  val notification = NotificationCompat.Builder(this, channelId)
                      .setSmallIcon(android.R.drawable.ic_dialog_alert)
                      .setContentTitle(title)
                      .setContentText(body)
                      .setStyle(NotificationCompat.BigTextStyle().bigText(body))
                      .setPriority(NotificationCompat.PRIORITY_MAX)
                      .setCategory(NotificationCompat.CATEGORY_ALARM)
                      .setAutoCancel(true)
                      .setContentIntent(pending)
                      .build()
                  (getSystemService(Context.NOTIFICATION_SERVICE) as NotificationManager)
                      .notify((System.currentTimeMillis() and 0x7fffffff).toInt(), notification)
              }

              private fun speakAssignment(text: String) {
                  if (Build.VERSION.SDK_INT < Build.VERSION_CODES.LOLLIPOP) return
                  if (textToSpeech == null) {
                      textToSpeech = TextToSpeech(this) { status ->
                          if (status == TextToSpeech.SUCCESS) {
                              textToSpeech?.language = Locale.getDefault()
                              textToSpeech?.speak(text, TextToSpeech.QUEUE_FLUSH, null, "allways_assignment")
                          }
                      }
                  } else {
                      textToSpeech?.speak(text, TextToSpeech.QUEUE_FLUSH, null, "allways_assignment")
                  }
              }

              override fun onDestroy() {
                  textToSpeech?.stop()
                  textToSpeech?.shutdown()
                  textToSpeech = null
                  super.onDestroy()
              }
          }
          KOTLIN

      - name: Configure native in-app updater
        shell: bash
        run: python3 tool/configure_android_updater.py

      - name: Configure release signing
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.ALLWAYS_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ALLWAYS_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ALLWAYS_KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_B64"
          test -n "$STORE_PASSWORD"
          test -n "$KEY_PASSWORD"
          printf '%s' "$KEYSTORE_B64" | base64 --decode > android/app/allways-release.jks
          test -s android/app/allways-release.jks
          KEY_ALIAS="$(keytool -list -v -keystore android/app/allways-release.jks -storepass "$STORE_PASSWORD" | awk -F': ' '/^Alias name:/{print $2; exit}')"
          test "$KEY_ALIAS" = "allways"
          cat > android/key.properties <<EOF
          storeFile=app/allways-release.jks
          storePassword=$STORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          EOF

      - name: Flutter pub get
        shell: bash
        run: flutter pub get

      - name: Analyze
        shell: bash
        run: flutter analyze

      - name: Test
        shell: bash
        run: flutter test

      - name: Validate production map tile provider
        env:
          MAP_TILE_URL: ${{ vars.MAP_TILE_URL }}
          MAPBOX_PUBLIC_TOKEN: ${{ secrets.MAPBOX_PUBLIC_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${MAP_TILE_URL:-}" ]]; then
            if [[ "${MAPBOX_PUBLIC_TOKEN:-}" == pk.* ]]; then
              MAP_TILE_URL="https://api.mapbox.com/styles/v1/mapbox/streets-v12/tiles/256/{z}/{x}/{y}?access_token=${MAPBOX_PUBLIC_TOKEN}"
              echo "No MAP_TILE_URL variable set; using Mapbox Streets with the configured public token."
            else
              echo "::error::Set MAP_TILE_URL to a contracted HTTPS tile endpoint or configure MAPBOX_PUBLIC_TOKEN (pk.*) in repository Actions secrets."
              exit 1
            fi
          fi
          case "$MAP_TILE_URL" in
            https://*) ;;
            *) echo "::error::MAP_TILE_URL must use HTTPS."; exit 1 ;;
          esac
          case "$MAP_TILE_URL" in
            *tile.openstreetmap.org*|*cartocdn.com*)
              echo "::error::Public OpenStreetMap/CARTO tile endpoints are not approved for production-scale ALLways ride/delivery navigation."
              exit 1
              ;;
          esac
          echo "MAP_TILE_URL=$MAP_TILE_URL" >> "$GITHUB_ENV"

      - name: Build release APK
        shell: bash
        env:
          MAPBOX_PUBLIC_TOKEN: ${{ secrets.MAPBOX_PUBLIC_TOKEN }}
        run: flutter build apk --release --target-platform android-arm64 --obfuscate --split-debug-info=build/symbols --dart-define=MAP_TILE_URL="${MAP_TILE_URL}"

      - name: Enforce 25 MB release APK limit
        shell: bash
        run: |
          APK="build/app/outputs/flutter-apk/app-release.apk"
          test -s "$APK"
          SIZE=$(stat -c%s "$APK")
          echo "Release APK size: $SIZE bytes"
          if [ "$SIZE" -gt 25000000 ]; then
            echo "Release APK must be below 25,000,000 bytes; refusing to publish."
            exit 1
          fi


      - name: Verify APK identity
        shell: bash
        run: |
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt2 | sort -V | tail -n 1)"
          test -n "$AAPT"
          "$AAPT" dump badging build/app/outputs/flutter-apk/app-release.apk | grep -F "package: name='com.allways.delivery'"
          "$AAPT" dump badging build/app/outputs/flutter-apk/app-release.apk | grep -F "application-label:'ALLways Delivery Partner'"

      - name: Verify signed production APK
        shell: bash
        run: |
          set -euo pipefail
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -n "$APKSIGNER"
          "$APKSIGNER" verify --verbose build/app/outputs/flutter-apk/app-release.apk
          "$APKSIGNER" verify --print-certs build/app/outputs/flutter-apk/app-release.apk

      - name: Extract App Version
        shell: bash
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | awk '{print $2}' | cut -d '+' -f 1)
          test -n "$VERSION"
          echo "APP_VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Preserve signed arm64 production APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-assets
          cp build/app/outputs/flutter-apk/app-release.apk "release-assets/allways-delivery-partner-v${{ env.APP_VERSION }}.apk"

      - name: Build release-mode x86_64 startup-test APK
        shell: bash
        run: |
          set -euo pipefail
          test -n "${MAP_TILE_URL:-}"
          flutter build apk --release --target-platform android-x64 --obfuscate --split-debug-info=build/smoke-symbols --dart-define=MAP_TILE_URL="${MAP_TILE_URL}"

      - name: Android release-mode launch smoke test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_2
          cores: 2
          disable-animations: true
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect
          script: |
            set -eu
            adb wait-for-device
            ready=0
            for attempt in $(seq 1 90); do
              boot="$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')"
              if [ "$boot" = "1" ] && adb shell cmd package list packages >/dev/null 2>&1 && adb shell dumpsys activity activities >/dev/null 2>&1; then
                ready=1
                break
              fi
              sleep 2
            done
            if [ "$ready" != "1" ]; then
              echo "::error::Android emulator services did not become ready."
              adb logcat -d -t 1500 | tail -n 300 || true
              exit 1
            fi
            adb logcat -c
            APK="build/app/outputs/flutter-apk/app-release.apk"
            installed=0
            for attempt in 1 2 3 4; do
              if adb install -r "$APK"; then installed=1; break; fi
              sleep 5
            done
            if [ "$installed" != "1" ]; then
              echo "::error::Release-mode x86_64 APK could not be installed."
              adb logcat -d -t 1500 | tail -n 300 || true
              exit 1
            fi
            timeout 90s adb shell am start -W -n com.allways.delivery/.MainActivity
            sleep 15
            if ! adb shell pidof com.allways.delivery >/dev/null; then
              echo "::error::Delivery Partner process exited after launch."
              adb logcat -d -t 1800 | grep -E 'FATAL EXCEPTION|AndroidRuntime|Process: com.allways.delivery|Unable to start activity' || true
              adb shell dumpsys activity activities | grep -E 'mResumedActivity|topResumedActivity' || true
              exit 1
            fi
            adb shell dumpsys activity activities | grep -F 'com.allways.delivery' >/dev/null || {
              echo "::error::Delivery Partner did not remain the resumed activity."
              adb shell dumpsys activity activities | grep -E 'mResumedActivity|topResumedActivity' || true
              exit 1
            }

      - name: Prepare release assets
        shell: bash
        run: |
          set -euo pipefail
          cp "release-assets/allways-delivery-partner-v${{ env.APP_VERSION }}.apk" "release-assets/allways-delivery-partner-latest.apk"

      - name: Publish latest APK release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: allways-latest
          name: "ALLways Delivery Partner v${{ env.APP_VERSION }}"
          draft: false
          prerelease: false
          files: |
            release-assets/allways-delivery-partner-v${{ env.APP_VERSION }}.apk
            release-assets/allways-delivery-partner-latest.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

