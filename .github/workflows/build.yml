name: ALLways Delivery Partner Android
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: allways-delivery-partner-android
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: self-hosted
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare Windows Git Bash for Flutter Action
        shell: cmd
        run: |
          if not exist "C:\Program Files\Git\bin\bash.exe" exit /b 1
          echo C:\Program Files\Git\bin>>"%GITHUB_PATH%"
          echo C:\Program Files\Git\cmd>>"%GITHUB_PATH%"
          "C:\Program Files\Git\bin\bash.exe" --version

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Bootstrap Android
        shell: cmd
        run: |
          flutter create --platforms=android --org com.allways --project-name allways_delivery_partner .
          py -3 - <<'PY'
          from pathlib import Path
          p = Path("android/settings.gradle.kts")
          s = p.read_text()
          if 'id("com.google.gms.google-services") version "4.5.0" apply false' not in s:
              s = s.replace(
                  "plugins {",
                  'plugins {\n    id("com.google.gms.google-services") version "4.5.0" apply false',
                  1,
              )
          p.write_text(s)

          p = Path("android/app/build.gradle.kts")
          s = p.read_text()
          if 'id("com.google.gms.google-services")' not in s:
              s = s.replace(
                  "plugins {",
                  'plugins {\n    id("com.google.gms.google-services")',
                  1,
              )
          prefix = """import java.util.Properties

          val keystorePropertiesFile = rootProject.file("key.properties")
          val keystoreProperties = Properties()
          if (keystorePropertiesFile.exists()) {
              keystorePropertiesFile.inputStream().use { keystoreProperties.load(it) }
          }

          """
          if "val keystorePropertiesFile = rootProject.file" not in s:
              s = prefix + s
          signing = """    signingConfigs {
              if (keystorePropertiesFile.exists()) {
                  create("release") {
                      keyAlias = keystoreProperties["keyAlias"] as String
                      keyPassword = keystoreProperties["keyPassword"] as String
                      storeFile = rootProject.file(keystoreProperties["storeFile"] as String)
                      storePassword = keystoreProperties["storePassword"] as String
                  }
              }
          }

          """
          if "signingConfigs {" not in s:
              s = s.replace("android {", "android {" + chr(10) + signing, 1)
          s = s.replace('signingConfig = signingConfigs.getByName("debug")',
              'signingConfig = if (keystorePropertiesFile.exists()) { signingConfigs.getByName("release") } else { signingConfigs.getByName("debug") }')
          s = s.replace('namespace = "com.example.delivery"', 'namespace = "com.allways.delivery"')
          s = s.replace('applicationId = "com.example.delivery"', 'applicationId = "com.allways.delivery"')
          if 'namespace = "com.allways.delivery"' not in s:
              s = s.replace("android {", 'android {\n    namespace = "com.allways.delivery"', 1)
          s = s.replace('namespace = "com.example.delivery"', 'namespace = "com.allways.delivery"')
          s = s.replace('applicationId = "com.example.delivery"', 'applicationId = "com.allways.delivery"')
          if 'applicationId = "com.allways.delivery"' not in s:
              s = s.replace('applicationId = ""', 'applicationId = "com.allways.delivery"', 1)
          p.write_text(s)

          manifest = Path("android/app/src/main/AndroidManifest.xml")
          manifest.parent.mkdir(parents=True, exist_ok=True)
          manifest.write_text("""<manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>
            <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION"/>
            <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION"/>
            <uses-permission android:name="android.permission.ACCESS_BACKGROUND_LOCATION"/>
            <uses-permission android:name="android.permission.FOREGROUND_SERVICE"/>
            <uses-permission android:name="android.permission.FOREGROUND_SERVICE_LOCATION"/>
            <application android:label="ALLways Delivery Partner" android:icon="@mipmap/ic_launcher">
              <activity android:name=".MainActivity" android:exported="true" android:launchMode="singleTop" android:theme="@style/LaunchTheme" android:configChanges="orientation|keyboardHidden|keyboard|screenSize|smallestScreenSize|locale|layoutDirection|fontScale|screenLayout|density|uiMode" android:hardwareAccelerated="true" android:windowSoftInputMode="adjustResize">
                <meta-data android:name="io.flutter.embedding.android.NormalTheme" android:resource="@style/NormalTheme"/>
                <intent-filter><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/></intent-filter>
              </activity>
              <meta-data android:name="com.google.firebase.messaging.default_notification_channel_id" android:value="allways_urgent_v2"/>
              <meta-data android:name="flutterEmbedding" android:value="2"/>
            </application>
          </manifest>
          """)
          PY

          cat > android/app/src/main/kotlin/com/allways/delivery/MainActivity.kt <<'KOTLIN'
          package com.allways.delivery
          import android.app.NotificationChannel
          import android.app.NotificationManager
          import android.app.PendingIntent
          import android.content.Context
          import android.content.Intent
          import android.media.AudioAttributes
          import android.media.RingtoneManager
          import android.os.Build
          import android.os.Bundle
          import android.speech.tts.TextToSpeech
          import androidx.core.app.NotificationCompat
          import io.flutter.embedding.android.FlutterActivity
          import io.flutter.embedding.engine.FlutterEngine
          import io.flutter.plugin.common.MethodChannel
          import java.util.Locale

          class MainActivity : FlutterActivity() {
              private val channelId = "allways_urgent_v2"
              private var textToSpeech: TextToSpeech? = null

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  createChannel()
              }

              override fun configureFlutterEngine(flutterEngine: FlutterEngine) {
                  super.configureFlutterEngine(flutterEngine)
                  MethodChannel(flutterEngine.dartExecutor.binaryMessenger, "allways_notifications")
                      .setMethodCallHandler { call, result ->
                          when (call.method) {
                              "showNotification" -> {
                                  showNotification(call.argument<String>("title") ?: "ALLways", call.argument<String>("body") ?: "")
                                  result.success(null)
                              }
                              "speakAssignment" -> {
                                  speakAssignment(call.argument<String>("text") ?: "New delivery assigned.")
                                  result.success(null)
                              }
                              else -> result.notImplemented()
                          }
                      }
              }

              private fun createChannel() {
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      val sound = RingtoneManager.getDefaultUri(RingtoneManager.TYPE_ALARM)
                      val audio = AudioAttributes.Builder().setUsage(AudioAttributes.USAGE_ALARM).build()
                      val channel = NotificationChannel(channelId, "ALLways Urgent Alerts", NotificationManager.IMPORTANCE_HIGH).apply {
                          description = "Ride and delivery requests that need immediate attention"
                          setSound(sound, audio)
                          enableVibration(true)
                          vibrationPattern = longArrayOf(0, 450, 180, 450, 180, 700)
                      }
                      getSystemService(NotificationManager::class.java).createNotificationChannel(channel)
                  }
              }

              private fun showNotification(title: String, body: String) {
                  createChannel()
                  val launch = packageManager.getLaunchIntentForPackage(packageName)?.apply {
                      flags = Intent.FLAG_ACTIVITY_NEW_TASK or Intent.FLAG_ACTIVITY_CLEAR_TOP
                  }
                  val pending = launch?.let {
                      PendingIntent.getActivity(
                          this, (System.currentTimeMillis() and 0x7fffffff).toInt(), it,
                          PendingIntent.FLAG_UPDATE_CURRENT or if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.M) PendingIntent.FLAG_IMMUTABLE else 0
                      )
                  }
                  val notification = NotificationCompat.Builder(this, channelId)
                      .setSmallIcon(android.R.drawable.ic_dialog_alert)
                      .setContentTitle(title)
                      .setContentText(body)
                      .setStyle(NotificationCompat.BigTextStyle().bigText(body))
                      .setPriority(NotificationCompat.PRIORITY_MAX)
                      .setCategory(NotificationCompat.CATEGORY_ALARM)
                      .setAutoCancel(true)
                      .setContentIntent(pending)
                      .build()
                  (getSystemService(Context.NOTIFICATION_SERVICE) as NotificationManager)
                      .notify((System.currentTimeMillis() and 0x7fffffff).toInt(), notification)
              }

              private fun speakAssignment(text: String) {
                  if (Build.VERSION.SDK_INT < Build.VERSION_CODES.LOLLIPOP) return
                  if (textToSpeech == null) {
                      textToSpeech = TextToSpeech(this) { status ->
                          if (status == TextToSpeech.SUCCESS) {
                              textToSpeech?.language = Locale.getDefault()
                              textToSpeech?.speak(text, TextToSpeech.QUEUE_FLUSH, null, "allways_assignment")
                          }
                      }
                  } else {
                      textToSpeech?.speak(text, TextToSpeech.QUEUE_FLUSH, null, "allways_assignment")
                  }
              }

              override fun onDestroy() {
                  textToSpeech?.stop()
                  textToSpeech?.shutdown()
                  textToSpeech = null
                  super.onDestroy()
              }
          }
          KOTLIN
      - name: Configure native in-app updater
        shell: cmd
        run: py -3 tool/configure_android_updater.py

      - name: Configure release signing
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.ALLWAYS_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ALLWAYS_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ALLWAYS_KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_B64"
          test -n "$STORE_PASSWORD"
          test -n "$KEY_PASSWORD"
          printf '%s' "$KEYSTORE_B64" | base64 --decode > android/app/allways-release.jks
          test -s android/app/allways-release.jks
          KEY_ALIAS="$(keytool -list -v -keystore android/app/allways-release.jks -storepass "$STORE_PASSWORD" | awk -F': ' '/^Alias name:/{print $2; exit}')"
          test "$KEY_ALIAS" = "allways"
          cat > android/key.properties <<EOF
          storeFile=app/allways-release.jks
          storePassword=$STORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          EOF

      - name: Validate Mapbox public token
        shell: bash
        env:
          MAPBOX_PUBLIC_TOKEN: ${{ secrets.MAPBOX_PUBLIC_TOKEN }}
        run: |
          test -n "$MAPBOX_PUBLIC_TOKEN"
          case "$MAPBOX_PUBLIC_TOKEN" in pk.*) echo "Mapbox public token configured." ;; *) echo "MAPBOX_PUBLIC_TOKEN must start with pk."; exit 1 ;; esac

      - name: Flutter pub get
        shell: bash
        run: flutter pub get

      - name: Analyze
        shell: bash
        run: flutter analyze

      - name: Test
        shell: bash
        run: flutter test

      - name: Build release APK
        env:
          MAPBOX_PUBLIC_TOKEN: ${{ secrets.MAPBOX_PUBLIC_TOKEN }}
        shell: bash
        run: flutter build apk --release --target-platform android-arm64 --obfuscate --split-debug-info=build/symbols --dart-define=MAPBOX_PUBLIC_TOKEN="${MAPBOX_PUBLIC_TOKEN}"

      - name: Verify APK identity
        shell: cmd
        run: |
          set "AAPT=%ANDROID_HOME%\build-tools\35.0.0\aapt2.exe"
          if not exist "%AAPT%" for /f "delims=" %%D in ('dir /b /ad /o-n "%ANDROID_HOME%\build-tools"') do if not defined FOUND set "FOUND=%%D"
          if defined FOUND set "AAPT=%ANDROID_HOME%\build-tools\%FOUND%\aapt2.exe"
          if not exist "%AAPT%" exit /b 1
          "%AAPT%" dump badging build\app\outputs\flutter-apk\app-release.apk | findstr /C:"package: name='com.allways.delivery'" /C:"application-label:'ALLways Delivery Partner'"

      - name: Extract App Version
        shell: bash
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | awk '{print $2}' | cut -d '+' -f 1)
          test -n "$VERSION"
          echo "APP_VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Prepare release assets
        shell: bash
        run: |
          mkdir -p release-assets
          cp build/app/outputs/flutter-apk/app-release.apk "release-assets/allways-delivery-partner-v${APP_VERSION}.apk"
          cp build/app/outputs/flutter-apk/app-release.apk "release-assets/allways-delivery-partner-latest.apk"

      - name: Publish latest APK release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: allways-latest
          name: "ALLways Delivery Partner v${{ env.APP_VERSION }}"
          draft: false
          prerelease: false
          files: |
            release-assets/allways-delivery-partner-v${APP_VERSION}.apk
            release-assets/allways-delivery-partner-latest.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Android runtime smoke test
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_2
          cores: 4
          disable-animations: true
          script: |
            adb install -r build/app/outputs/flutter-apk/app-release.apk
            timeout 90s adb shell am start -S -W -n com.allways.delivery/.MainActivity
            adb shell pidof com.allways.delivery
